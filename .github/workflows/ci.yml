name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Swift package tests
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build app (Debug, unsigned)
        run: |
          xcodebuild \
            -project Merge.xcodeproj \
            -scheme Merge \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  package:
    name: Package release artifacts
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Produces the DMG plus the two browser-extension archives. This is the
      # same script used for local releases, so CI and a manual build cannot drift.
      - name: Build artifacts
        run: ./Scripts/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Netwich-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
