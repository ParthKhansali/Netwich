<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Netwich macOS app icon</title>
  <desc id="desc">High-performance network link aggregation icon on a deep space glass tile.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="blueStrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="mintStrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="railShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with 1px glass border -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#centerGlow)"/>
  <rect x="1" y="1" width="1022" height="1022" rx="223" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Centered Scaled Mark -->
  <g transform="translate(192 192) scale(2.5)">
    <!-- Top Rail -->
    <rect x="32" y="54" width="192" height="26" rx="13" fill="url(#railGrad)" filter="url(#railShadow)"/>

    <!-- Under Strand (Cyber Mint) -->
    <path d="M44 150 H92 C116 150 126 141 144 128 C162 114 180 114 212 114" fill="none" stroke="url(#mintStrand)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Occlusion Gap for 3D Layering -->
    <path d="M44 114 H92 C116 114 126 123 144 136 C162 150 180 150 212 150" fill="none" stroke="#060910" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Over Strand (Electric Cobalt) -->
    <path d="M44 114 H92 C116 114 126 123 144 136 C162 150 180 150 212 150" fill="none" stroke="url(#blueStrand)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Rail -->
    <rect x="32" y="176" width="192" height="26" rx="13" fill="url(#railGrad)" filter="url(#railShadow)"/>
  </g>
</svg>
