<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Netwich symbol</title>
  <desc id="desc">Two intertwined network paths stacked between two clean horizontal rails.</desc>
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="railGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Top Rail -->
  <rect x="32" y="54" width="192" height="26" rx="13" fill="url(#railGradLight)"/>

  <!-- Under Strand (Cyber Mint) -->
  <path d="M44 150 H92 C116 150 126 141 144 128 C162 114 180 114 212 114" fill="none" stroke="url(#mintGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Occlusion Gap -->
  <path d="M44 114 H92 C116 114 126 123 144 136 C162 150 180 150 212 150" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Over Strand (Electric Cobalt) -->
  <path d="M44 114 H92 C116 114 126 123 144 136 C162 150 180 150 212 150" fill="none" stroke="url(#blueGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Rail -->
  <rect x="32" y="176" width="192" height="26" rx="13" fill="url(#railGradLight)"/>
</svg>
